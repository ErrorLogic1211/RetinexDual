# general settings
name: RetinexDuelSambaFusionFinalizationDeblur
model_type: ImageCleanModel
scale: 1
num_gpu: 4  # set num_gpu: 0 for cpu mode
manual_seed: 100

# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: Dataset_PairedImage
    dataroot_gt: datasets/UHD-Blur/train/gt_new
    dataroot_lq: datasets/UHD-Blur/train/input_new
    geometric_augs: true

    filename_tmpl: '{}'
    io_backend:
      type: disk

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 3
    batch_size_per_gpu: 3

    ### -------------Progressive training--------------------------
    # mini_batch_sizes: [8,4,4,2,2,1]             # Batch size per gpu
    # iters: [46000,32000,24000,18000,18000,12000]
    # gt_size: 1600 # 1280  1600  # Max patch size for progressive training
    # gt_sizes: [720,1024,1024,1280,1280,1600] # [128,160,192,256,320,384]  # Patch sizes for progressive training.
    ### ------------------------------------------------------------

    ### ------- Training on single fixed-patch size 600x600---------
    mini_batch_sizes: [3]
    iters: [500000]
    gt_size: 768   
    gt_sizes: [768]
    ### ------------------------------------------------------------

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: Dataset_PairedImage
    dataroot_gt: datasets/UHD-Blur/test/gt300
    dataroot_lq: datasets/UHD-Blur/test/input300
    io_backend:
      type: disk

# network structures
network_g:
  type: RetinexDuelSambaFusionFinalization
  in_channels: 3
  out_channels: 3
  L_n_feat: 16
  R_n_feat: 16

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~
  experiments_root: ~
  results_root: ~

# training settings
train:
  total_iter: 500000
  warmup_iter: -1 # no warm up
  use_grad_clip: true

  # Split 300k iterations into two cycles. 
  # 1st cycle: fixed 3e-4 LR for 92k iters. 
  # 2nd cycle: cosine annealing (3e-4 to 1e-6) for 208k iters.
  scheduler:
    # type: CosineAnnealingRestartCyclicLR
    # periods: [33000, 67000]       
    # restart_weights: [1,1]
    # eta_mins: [0.0003,0.000001]   
    type: CosineAnnealingRestartCyclicLR 
    periods: [500000]
    restart_weights: [1]
    eta_mins: [0.0001, 0.0000001] 
  
  mixing_augs:
    mixup: true # false # true
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: AdamW
    lr: !!float 2e-4
    weight_decay: !!float 1e-3
    betas: [0.9, 0.999]
  
  # losses
  pixel_opt:
    type: RetinexDuelLoss 
    loss_weight: 1
    reduction: mean

# validation settings
val:
  window_size: 4
  val_freq: !!float 10000
  save_img: true
  rgb2bgr: true
  use_image: false
  max_minibatch: 1

  key_metric: psnr
  metrics:
    psnr: 
      type: calculate_psnr 
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
    
  # metrics:
  #   psnr: # metric name, can be arbitrary
  #     type: calculate_psnr
  #     crop_border: 0
  #     test_y_channel: false

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 10000
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
  find_unused_parameters: true  # Add this line to avoid errors with unused parameters
